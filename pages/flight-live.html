<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aerial Fences · Vuelo en vivo</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue:#1736F5; --navy:#111D4A; --ink:#001011;
  --muted:#A9BCD0; --border:#D8DBE2; --bg:#F4F6FA;
  --font:'Outfit',system-ui,sans-serif;
  --green:#15803d; --amber:#b45309; --red:#b91c1c;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--font);color:var(--ink);overflow:hidden;}
.layout{
  display:grid;grid-template-columns:340px 1fr;height:100vh;
}
aside{
  background:#fff;border-right:1px solid var(--border);
  padding:24px 22px;overflow-y:auto;
}
.back{
  font-size:12px;color:var(--muted);text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;
}
.back:hover{color:var(--navy);}
h2{font-size:18px;font-weight:600;color:var(--navy);line-height:1.3;margin-bottom:16px;}
h3{
  font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em;margin:22px 0 8px;
}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;}
dt{color:var(--muted);font-weight:500;}
dd{color:var(--ink);font-family:ui-monospace,monospace;font-size:12px;}
.status-row{display:flex;align-items:center;gap:10px;font-size:13px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);}
.dot.connected{background:var(--green);animation:pulse 1.6s infinite;}
.dot.disconnected{background:var(--red);}
.dot.ended{background:var(--muted);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.metric{
  font-size:13px;color:#5b6478;margin-top:6px;
}
.metric strong{color:var(--navy);font-weight:600;}
.banner{
  margin-top:18px;padding:10px 12px;border-radius:8px;
  font-size:12px;background:#fef3c7;color:#92400e;
  border:1px solid #fde68a;display:none;
}
.banner.show{display:block;}
#map{height:100%;width:100%;}
.error-screen{
  position:absolute;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--red);padding:2em;text-align:center;
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <a class="back" href="flights-list.html">← Vuelos en vivo</a>
    <h2 id="flight-title">…</h2>
    <dl id="flight-meta"></dl>

    <h3>Estado</h3>
    <div class="status-row">
      <span id="conn-dot" class="dot"></span>
      <span id="conn-text">conectando…</span>
    </div>
    <p class="metric"><span id="photo-count">0</span> fotos</p>
    <p class="metric" id="strategy">strategy v—</p>

    <div id="drone-done-banner" class="banner">
      El dron terminó de subir fotos. El operador puede cerrar el vuelo.
    </div>
  </aside>
  <div id="map"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="../config.local.js" onerror="console.warn('config.local.js no encontrado — el token Mapbox solo vendrá de GET /config')"></script>
<script type="module" src="../src/pages/flight-live.js"></script>
</body>
</html>
